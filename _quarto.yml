# Quarto book — household checklists and bicycle maintenance notes.
# https://quarto.org/docs/books/

# =========================
# Project scope and build
# =========================
project:
  type: book
  output-dir: _book
  render:
    - index.qmd
    - gardening/checklists.qmd
    - gardening/plant-care.qmd
    - interior/equipment-lists.qmd
    - biking/bike-overview.qmd
    - biking/brakes.qmd
    - biking/gears.qmd
    - biking/tyres-wheels.qmd
    - biking/steering.qmd
    - biking/glossary.qmd

# =========================
# Book metadata and order
# =========================
book:
  title: "How to read this book?"
  description: >
    Practical checklists and maintenance notes for setting up a home,
    gardening on a balcony or small plot, and keeping a road bike in
    good working order.
  author: "Bastien Chassagnol"
  output-file: how-to-read-this-book
  chapters:
    - index.qmd
    - part: "Gardening and planting"
      chapters:
        - gardening/checklists.qmd
        - gardening/plant-care.qmd
    - part: "Interior DIY and equipment"
      chapters:
        - interior/equipment-lists.qmd
    - part: "Bicycle maintenance"
      chapters:
        - biking/bike-overview.qmd
        - biking/brakes.qmd
        - biking/gears.qmd
        - biking/tyres-wheels.qmd
        - biking/steering.qmd
        - biking/glossary.qmd
  repo-url: https://github.com/bastienchassagnol/Housework-items
  site-url: https://bastienchassagnol.github.io/Housework-items/
  repo-branch: main
  repo-actions: [edit, issue, source]
  open-graph: true
  downloads: [pdf]
  comments:
    hypothesis: true
  page-footer:
    center: |
      Built with <a href="https://quarto.org/">Quarto</a>.
    background: "#f8f9fa"
    border: false
    right:
      - icon: github
        href: https://github.com/bastienchassagnol/Housework-items

# =========================
# Shared document defaults
# =========================
quarto-required: ">= 1.9.0"
toc: true
toc-depth: 4
number-sections: true
number-depth: 4
tbl-cap-location: bottom
fig-align: center
out-width: "80%"
fig-dpi: 320
lang: en-GB

# =========================
# Output formats
# =========================
format:
  html:
    page-layout: full
    lightbox: true
    smooth-scroll: true
    code-fold: true
    code-tools: false
    code-overflow: wrap
    crossrefs-hover: true
    footnotes-hover: true
    mermaid:
      theme: default
    comments:
      hypothesis: true
  typst:
    papersize: a4
    margin:
      x: 2cm
      y: 2.5cm

# =========================
# Filters and execution
# =========================
execute:
  echo: false
  eval: true
  message: false
  warning: false
  error: true
  freeze: auto

# =========================
# Editor preferences
# =========================
editor:
  source: true

# =========================
# Cross-references
# =========================
crossref:
  chapters: true

# =========================
# Glossary (HTML popups)
# =========================
# https://debruine.github.io/quarto-glossary/
glossary:
  path: glossary.yml
  popup: click
  show: true

# =========================
# Metadata
# =========================
license: "MIT"
copyright:
  holder: Bastien Chassagnol
