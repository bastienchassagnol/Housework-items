on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Quarto
        run: |
          QUARTO_VERSION="1.9.20"
          curl -fsSL -o /tmp/quarto.tar.gz "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/quarto.tar.gz -C /tmp
          echo "/tmp/quarto-${QUARTO_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Render and publish
        run: quarto publish gh-pages --no-browser --no-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
